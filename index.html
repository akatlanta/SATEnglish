<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SAT English Practice | Reading & Writing</title>
<style>
  :root{
    --blue:#2554c7;
    --blue-dark:#1a3d94;
    --purple:#7c3aed;
    --green:#0f9d58;
    --amber:#d97706;
    --ink:#1c2331;
    --ink-soft:#525a6b;
    --bg:#f4f6fb;
    --card:#ffffff;
    --border:#e2e6ef;
    --good:#0f9d58;
    --good-bg:#e8f8ee;
    --bad:#d64545;
    --bad-bg:#fdecec;
    --radius:14px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:"Segoe UI", Roboto, -apple-system, BlinkMacSystemFont, Arial, sans-serif;
    background:var(--bg);
    color:var(--ink);
    min-height:100vh;
  }
  .topbar{
    background:linear-gradient(135deg,var(--blue),var(--blue-dark));
    color:#fff;
    padding:18px 28px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    box-shadow:0 2px 10px rgba(20,40,90,0.15);
  }
  .brand{display:flex;align-items:center;gap:12px;cursor:pointer;}
  .brand .logo{
    width:38px;height:38px;border-radius:10px;background:rgba(255,255,255,0.15);
    display:flex;align-items:center;justify-content:center;font-weight:800;font-size:16px;
  }
  .brand h1{font-size:19px;margin:0;font-weight:700;letter-spacing:0.2px;}
  .brand span{font-size:12px;opacity:0.85;display:block;font-weight:400;}
  .session-stats{font-size:13px;opacity:0.9;text-align:right;line-height:1.4;}

  .container{
    max-width:980px;
    margin:0 auto;
    padding:32px 20px 60px;
  }

  .section-title{font-size:22px;font-weight:700;margin:0 0 6px;}
  .section-sub{color:var(--ink-soft);margin:0 0 26px;font-size:14.5px;}

  .domain-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
    gap:18px;
    margin-bottom:30px;
  }
  .domain-card{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:var(--radius);
    padding:20px;
    cursor:pointer;
    transition:transform .15s ease, box-shadow .15s ease;
    border-top:4px solid var(--accent, var(--blue));
  }
  .domain-card:hover{transform:translateY(-3px);box-shadow:0 10px 24px rgba(30,45,90,0.10);}
  .domain-card h3{margin:0 0 8px;font-size:17px;}
  .domain-card p{margin:0 0 12px;color:var(--ink-soft);font-size:13.5px;line-height:1.45;}
  .chip-row{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px;}
  .chip{
    font-size:11.5px;background:var(--bg);border:1px solid var(--border);
    padding:3px 9px;border-radius:999px;color:var(--ink-soft);
  }
  .domain-progress{font-size:12.5px;color:var(--ink-soft);}
  .domain-progress b{color:var(--ink);}

  .mixed-cta{
    display:flex;align-items:center;justify-content:space-between;
    background:linear-gradient(135deg,#1c2331,#333d54);
    color:#fff;border-radius:var(--radius);padding:20px 24px;margin-bottom:8px;
  }
  .mixed-cta h3{margin:0 0 4px;font-size:16.5px;}
  .mixed-cta p{margin:0;font-size:13px;opacity:0.85;}

  .btn{
    border:none;border-radius:9px;padding:10px 18px;font-size:14px;font-weight:600;
    cursor:pointer;transition:opacity .15s ease, transform .1s ease;
  }
  .btn:active{transform:scale(0.97);}
  .btn-primary{background:var(--blue);color:#fff;}
  .btn-primary:hover{opacity:0.9;}
  .btn-ghost{background:transparent;color:var(--ink-soft);border:1px solid var(--border);}
  .btn-ghost:hover{background:var(--bg);}
  .btn-light{background:rgba(255,255,255,0.15);color:#fff;}
  .btn-light:hover{background:rgba(255,255,255,0.25);}
  .btn:disabled{opacity:0.5;cursor:not-allowed;}

  .back-link{
    display:inline-flex;align-items:center;gap:6px;color:var(--blue);
    font-size:13.5px;font-weight:600;cursor:pointer;margin-bottom:18px;background:none;border:none;padding:0;
  }
  .back-link:hover{text-decoration:underline;}

  .set-list{display:flex;flex-direction:column;gap:12px;}
  .set-row{
    background:var(--card);border:1px solid var(--border);border-radius:12px;
    padding:16px 18px;display:flex;align-items:center;justify-content:space-between;gap:16px;
  }
  .set-row .info h4{margin:0 0 4px;font-size:15px;}
  .set-row .info p{margin:0;font-size:12.5px;color:var(--ink-soft);}
  .set-row .right{display:flex;align-items:center;gap:14px;}
  .best-score{font-size:12px;color:var(--ink-soft);text-align:right;min-width:70px;}
  .best-score b{display:block;color:var(--ink);font-size:14px;}

  /* Quiz screen */
  .quiz-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
  .quiz-title{font-size:14px;font-weight:700;color:var(--ink-soft);}
  .progress-track{
    height:8px;background:var(--border);border-radius:999px;overflow:hidden;margin-bottom:22px;
  }
  .progress-fill{height:100%;background:var(--blue);border-radius:999px;transition:width .25s ease;}

  .q-card{
    background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
    padding:26px;margin-bottom:18px;
  }
  .q-tag{
    display:inline-block;font-size:11px;font-weight:700;letter-spacing:0.4px;text-transform:uppercase;
    color:var(--blue);background:#eaf0fe;padding:4px 10px;border-radius:999px;margin-bottom:14px;
  }
  .passage{
    background:var(--bg);border-left:3px solid var(--border);padding:14px 18px;border-radius:8px;
    font-size:14.5px;line-height:1.65;margin-bottom:18px;color:#2b3245;
  }
  .passage.two-text{display:flex;flex-direction:column;gap:12px;}
  .passage .label{font-weight:700;font-size:11.5px;text-transform:uppercase;color:var(--ink-soft);margin-bottom:4px;display:block;}
  .stem{font-size:15.5px;font-weight:600;margin-bottom:18px;line-height:1.5;}
  .choices{display:flex;flex-direction:column;gap:10px;}
  .choice{
    display:flex;align-items:flex-start;gap:12px;text-align:left;
    border:1.5px solid var(--border);border-radius:10px;padding:12px 14px;
    background:#fff;cursor:pointer;font-size:14.5px;line-height:1.5;color:var(--ink);
  }
  .choice:hover{border-color:var(--blue);background:#f7f9ff;}
  .choice .letter{
    flex:0 0 24px;height:24px;border-radius:50%;background:var(--bg);border:1.5px solid var(--border);
    display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:var(--ink-soft);
  }
  .choice.selected{border-color:var(--blue);background:#eaf0fe;}
  .choice.correct{border-color:var(--good);background:var(--good-bg);}
  .choice.correct .letter{background:var(--good);color:#fff;border-color:var(--good);}
  .choice.incorrect{border-color:var(--bad);background:var(--bad-bg);}
  .choice.incorrect .letter{background:var(--bad);color:#fff;border-color:var(--bad);}
  .choice.disabled{cursor:default;}
  .choice.dim{opacity:0.55;}

  .feedback{
    margin-top:18px;padding:16px 18px;border-radius:10px;font-size:14px;line-height:1.6;
  }
  .feedback.good{background:var(--good-bg);color:#0b6b3d;}
  .feedback.bad{background:var(--bad-bg);color:#a02f2f;}
  .feedback b{display:block;margin-bottom:4px;font-size:13.5px;}

  .quiz-footer{display:flex;justify-content:flex-end;gap:10px;}

  /* Results */
  .result-hero{
    background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
    padding:34px;text-align:center;margin-bottom:22px;
  }
  .score-big{font-size:46px;font-weight:800;margin:8px 0 4px;}
  .score-sub{color:var(--ink-soft);font-size:14px;margin-bottom:18px;}
  .result-actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;}

  .review-item{
    background:var(--card);border:1px solid var(--border);border-radius:12px;padding:18px 20px;margin-bottom:12px;
  }
  .review-item .tag-row{display:flex;align-items:center;gap:8px;margin-bottom:10px;}
  .status-pill{font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px;}
  .status-pill.good{background:var(--good-bg);color:var(--good);}
  .status-pill.bad{background:var(--bad-bg);color:var(--bad);}
  .review-item .stem{font-size:14.5px;margin-bottom:10px;}
  .review-line{font-size:13.5px;margin:4px 0;color:var(--ink-soft);}
  .review-line b{color:var(--ink);}
  .review-explain{margin-top:8px;font-size:13.5px;background:var(--bg);padding:10px 14px;border-radius:8px;color:#2b3245;}

  .hidden{display:none !important;}

  footer{text-align:center;color:var(--ink-soft);font-size:12px;padding:24px 0 10px;}

  @media (max-width:600px){
    .topbar{padding:14px 16px;}
    .session-stats{display:none;}
    .container{padding:22px 14px 50px;}
    .q-card{padding:18px;}
  }
</style>
</head>
<body>

<div class="topbar">
  <div class="brand" onclick="goHome()">
    <div class="logo">SP</div>
    <div>
      <h1>SAT Prep</h1>
      <span>Reading &amp; Writing Practice</span>
    </div>
  </div>
  <div class="session-stats" id="sessionStats">Sets completed this session: 0</div>
</div>

<div class="container" id="app"></div>

<footer>Original practice questions modeled on the digital SAT Reading &amp; Writing section. Not affiliated with College Board.</footer>

<script>
/* ============ DATA ============ */
// SETS metadata. `questions` filled in below, one domain at a time.
const DOMAINS = [
  { id:'d1', name:'Information and Ideas', color:'#2554c7',
    blurb:'Find central ideas, use evidence, and draw logical inferences from a text.',
    subtopics:['Central Ideas & Details','Command of Evidence','Inferences'] },
  { id:'d2', name:'Craft and Structure', color:'#7c3aed',
    blurb:'Interpret word choice, analyze structure/purpose, and connect ideas across two texts.',
    subtopics:['Words in Context','Text Structure & Purpose','Cross-Text Connections'] },
  { id:'d3', name:'Expression of Ideas', color:'#0f9d58',
    subtitle:'',
    blurb:'Synthesize notes rhetorically and choose transitions that connect ideas logically.',
    subtopics:['Rhetorical Synthesis','Transitions'] },
  { id:'d4', name:'Standard English Conventions', color:'#d97706',
    blurb:'Apply grammar rules: sentence boundaries and correct form, structure, and sense.',
    subtopics:['Boundaries','Form / Structure / Sense'] },
];

const SETS = [
  { id:'s1', domain:'d1', title:'Set 1: Central Ideas & Details', desc:'Identify the main point and key supporting details of a passage.' },
  { id:'s2', domain:'d1', title:'Set 2: Command of Evidence & Inferences', desc:'Use textual/quantitative evidence and draw logical inferences.' },
  { id:'s3', domain:'d2', title:'Set 3: Words in Context', desc:'Determine the most precise meaning of a word or phrase as used in context.' },
  { id:'s4', domain:'d2', title:'Set 4: Text Structure & Cross-Text Connections', desc:'Analyze how a passage is built, and relate two related texts to each other.' },
  { id:'s5', domain:'d3', title:'Set 5: Rhetorical Synthesis', desc:'Use bulleted research notes to accomplish a specific rhetorical goal.' },
  { id:'s6', domain:'d3', title:'Set 6: Transitions', desc:'Choose the transition word or phrase that best connects two ideas.' },
  { id:'s7', domain:'d4', title:'Set 7: Boundaries', desc:'Fix sentence boundaries: commas, semicolons, colons, and conjunctions.' },
  { id:'s8', domain:'d4', title:'Set 8: Form, Structure & Sense', desc:'Subject-verb agreement, verb tense, and dangling/misplaced modifiers.' },
];

// Each question: { set, passage (string or {a,b} for two-text), stem, choices:[4], correct: idx, explanation }
const QUESTIONS = [];

/* ===== QUESTION DATA INSERTED BELOW ===== */

// --- Domain 1: Information and Ideas ---

// Set 1: Central Ideas & Details (5)
QUESTIONS.push(
{ set:'s1', tag:'Central Ideas & Details',
  passage:`When Karl von Frisch began studying honeybees in the early twentieth century, he noticed that a forager returning to the hive would sometimes perform a figure-eight movement, waggling its body as it crossed the center line. Von Frisch eventually determined that this "waggle dance" was not a random display but a coded message: the angle of the waggle run relative to vertical indicated the direction of a food source relative to the sun, while the duration of the waggle indicated the distance. Other bees, by following and interpreting the dance, could fly directly to a flower patch they themselves had never visited.`,
  stem:`Which choice best states the main idea of the text?`,
  choices:[
    `Karl von Frisch was the first scientist to study the behavior of honeybees in a laboratory setting.`,
    `The waggle dance allows bees to communicate the location of food sources to other members of the hive.`,
    `Bees rely on the position of the sun to navigate long distances when searching for flowers.`,
    `Von Frisch's research proved that insects are capable of learning complex physical movements.`],
  correct:1,
  explanation:`The passage centers on how the waggle dance encodes direction and distance so that other bees can find food they haven't seen themselves. Choice B captures this main idea directly. A and D focus on von Frisch himself rather than the finding, and C mentions only one detail (the sun) rather than the dance's overall function.` },

{ set:'s1', tag:'Central Ideas & Details',
  passage:`Cities are often several degrees warmer than the surrounding countryside, a phenomenon known as the urban heat island effect. Concrete and asphalt absorb solar radiation during the day and release it slowly at night, while tall buildings can trap warm air at street level and block cooling winds. The effect is intensified by the removal of vegetation, since trees and soil would otherwise provide shade and release moisture through evaporation. Some cities have begun planting rooftop gardens and using lighter-colored pavement in an effort to reduce nighttime temperatures.`,
  stem:`Which choice best describes the overall focus of the text?`,
  choices:[
    `A description of why cities tend to be warmer than nearby rural areas and how some are responding.`,
    `An argument that rooftop gardens are the most effective solution to rising global temperatures.`,
    `A comparison of daytime and nighttime temperatures in several major cities around the world.`,
    `An explanation of how asphalt and concrete are manufactured for use in road construction.`],
  correct:0,
  explanation:`The text explains the causes of the urban heat island effect (materials, building shape, lost vegetation) and briefly notes mitigation efforts, matching choice A. B overstates the claim about rooftop gardens being "most effective." C and D focus on details not actually developed in the passage.` },

{ set:'s1', tag:'Central Ideas & Details',
  passage:`Mara had rehearsed the apology a dozen times on the walk over, each version more polished than the last, but when her sister opened the door, every rehearsed sentence dissolved. She stood there instead with her hands jammed in her pockets, saying only, "I should have called." It wasn't eloquent, and it wasn't what she'd planned, but her sister's shoulders loosened all the same, as though the plainness of it were exactly what had been missing from every text message Mara had sent that week.`,
  stem:`Which choice best states the main idea of the text?`,
  choices:[
    `Mara's sister was initially unwilling to forgive her for missing several phone calls.`,
    `A simple, unrehearsed admission succeeds where Mara's carefully planned words could not.`,
    `Mara regrets not writing her apology down before arriving at her sister's house.`,
    `Text messages are generally a poor substitute for face-to-face conversation between family members.`],
  correct:1,
  explanation:`The passage contrasts Mara's polished, rehearsed lines with the plain sentence that actually eased the tension, showing that sincerity mattered more than eloquence. Choice B captures this. A misreads the sister's reaction, C invents a detail not in the text, and D generalizes beyond what the passage states.` },

{ set:'s1', tag:'Central Ideas & Details',
  passage:`The spread of the printing press across fifteenth-century Europe did more than make books cheaper; it changed how knowledge itself circulated. Before movable type, a single scholar might spend years copying one manuscript by hand, and errors introduced during copying could persist unnoticed for generations. Printed editions, by contrast, could be checked, corrected, and then reproduced identically thousands of times. This meant that scholars in distant cities could work from the same reliable text and debate its content directly, rather than each working from a slightly different, hand-copied version.`,
  stem:`According to the text, what was one significant effect of the printing press?`,
  choices:[
    `It eliminated the need for scholars to travel between European cities to share ideas.`,
    `It allowed identical, corrected texts to be reproduced so that scholars could work from a shared, reliable source.`,
    `It made hand-copied manuscripts more valuable to collectors than printed books.`,
    `It reduced the overall number of books being produced across Europe each year.`],
  correct:1,
  explanation:`The passage states that printed editions could be corrected and reproduced identically, letting scholars "work from the same reliable text." Choice B restates this directly. The other choices describe effects not supported by the passage.` },

{ set:'s1', tag:'Central Ideas & Details',
  passage:`A recent study tracked the sleep patterns of college students during exam periods and found that students who slept fewer than six hours the night before a test scored, on average, ten percent lower than those who slept seven or more hours, even when both groups had studied for a similar number of hours beforehand. The researchers suggested that sleep may help the brain consolidate information learned earlier in the day, meaning that additional study time cannot fully substitute for adequate rest.`,
  stem:`Which choice best states the central claim of the text?`,
  choices:[
    `Students who study longer hours always perform better on exams than those who study less.`,
    `Sleep duration affects exam performance in a way that extra studying alone cannot fully compensate for.`,
    `Ten percent of college students report sleeping fewer than six hours during exam periods.`,
    `Researchers have proven that sleep is more important than studying for academic success.`],
  correct:1,
  explanation:`The passage's key finding is that shorter sleep correlated with lower scores regardless of study time, and that sleep may help "consolidate" learning—so more studying doesn't fully make up for lost sleep. Choice B reflects this. D overstates the claim ("more important than studying"), which the text doesn't assert.` }
);

// Set 2: Command of Evidence (5) & Inferences (5)
QUESTIONS.push(
{ set:'s2', tag:'Command of Evidence',
  passage:`Historians have long debated whether the Roman roads primarily served military or commercial purposes. Some point out that many major roads were built immediately following military campaigns, connecting newly conquered territory back to Rome. Others argue that the roads' lasting economic impact—the growth of trade towns along their routes and the standardization of cart-axle widths to match road grooves—suggests commerce quickly became their dominant use, regardless of their original purpose.`,
  stem:`Which choice, if true, would provide the most direct support for the claim that Roman roads' economic impact outlasted their military origins?`,
  choices:[
    `Records show that Roman legions used the roads to move troops within days of a road's completion.`,
    `Archaeological surveys find that towns along former Roman roads continued to grow as trade centers for centuries after Rome's military campaigns ended.`,
    `Some Roman roads were named after the generals who ordered their construction.`,
    `The width of Roman cart axles varied significantly from region to region.`],
  correct:1,
  explanation:`The claim is about long-term economic impact outlasting military origins. Choice B directly shows continued commercial growth "for centuries after" military campaigns ended, which is the strongest support. A supports the military-use side, and C and D don't address long-term economic impact.` },

{ set:'s2', tag:'Command of Evidence',
  passage:`A city council member argued that a proposed bike-lane expansion would reduce traffic congestion downtown. Critics countered that adding bike lanes would remove a lane of car traffic and worsen congestion instead.`,
  stem:`Which finding would best support the council member's argument?`,
  choices:[
    `A survey found that most downtown residents own at least one car.`,
    `In a comparable city, a similar bike-lane expansion was followed by a 12 percent drop in average car commute times, as more commuters switched to biking.`,
    `The cost of installing new bike lanes was higher than city planners initially estimated.`,
    `Bike lane usage tends to be higher in the spring and summer months than in winter.`],
  correct:1,
  explanation:`The council member claims the bike lanes will reduce congestion. Choice B provides a concrete precedent where a similar change led to shorter commute times, directly supporting that claim. The other choices are either irrelevant or support the critics' position.` },

{ set:'s2', tag:'Command of Evidence',
  passage:`In her memoir, chef Elena Voss writes that professional kitchens are "far more collaborative than the shouting matches shown on television." She describes a typical dinner service as a coordinated effort in which each cook silently anticipates the next person's needs.`,
  stem:`Which quotation from Voss's memoir would best support the claim that kitchen work is collaborative rather than combative?`,
  choices:[
    `"The head chef's title carries more weight in a formal kitchen than in a casual one."`,
    `"On a good night, I never have to ask for anything—the pan I need is already in my hand before I look up."`,
    `"Television producers often exaggerate conflict because it makes for better ratings."`,
    `"I trained in three different countries before opening my own restaurant."`],
  correct:1,
  explanation:`Choice B illustrates wordless teamwork—another cook anticipating a need before it's voiced—which is a concrete example of collaboration. The other quotations don't directly depict cooks working together.` },

{ set:'s2', tag:'Command of Evidence',
  passage:`Marketing researchers claim that consumers are more likely to purchase a product when a price is displayed as $9.99 rather than $10.00, a pattern sometimes called "left-digit bias," in which shoppers focus disproportionately on the leftmost digit of a price.`,
  stem:`Which of the following, if true, would best support the existence of left-digit bias?`,
  choices:[
    `In a controlled experiment, sales of an item rose by 24 percent when its price was changed from $10.00 to $9.99, with no other changes made.`,
    `Consumers reported in a survey that price was an important factor in their purchasing decisions.`,
    `A store increased the price of an item from $9.99 to $10.49 and total revenue for the month declined slightly.`,
    `Shoppers spent more time reading product descriptions than reading prices, according to eye-tracking data.`],
  correct:0,
  explanation:`Left-digit bias predicts a disproportionate response to a one-cent price change that shifts the leading digit. Choice A isolates exactly that variable and shows a large sales increase, providing direct experimental support. The other choices don't isolate the leading-digit effect.` },

{ set:'s2', tag:'Command of Evidence',
  passage:`A public health official claimed that a new handwashing awareness campaign reduced the spread of seasonal colds among elementary school students.`,
  stem:`Which finding would most directly undermine the official's claim?`,
  choices:[
    `Cold and flu rates among students dropped by a similar percentage in nearby districts that ran no such campaign.`,
    `The campaign included colorful posters placed near school bathroom sinks.`,
    `Teachers reported that most students seemed to enjoy the campaign's classroom activities.`,
    `The campaign cost less to run than the district had originally budgeted.`],
  correct:0,
  explanation:`If cold rates dropped just as much in districts without the campaign, that suggests some other factor—not the campaign—caused the decline, undermining the causal claim. The other choices describe the campaign but don't address whether it actually caused the drop.` },

{ set:'s2', tag:'Inferences',
  passage:`Octopuses have no rigid internal skeleton, which allows them to squeeze through any gap larger than their beak, the only hard part of their body. Researchers have filmed octopuses flattening themselves to slip through openings barely wider than a coin, then rapidly reassuming their normal shape once through. Because of this ability, aquariums housing octopuses must seal even the smallest gaps in tank lids, since a determined octopus that finds an opening will almost certainly _______`,
  stem:`Which choice most logically completes the text?`,
  choices:[
    `remain in its tank until a caretaker arrives to feed it.`,
    `use the opening to escape rather than staying inside the tank.`,
    `avoid the opening because it prefers familiar surroundings.`,
    `signal to aquarium staff that repairs are needed.`],
  correct:1,
  explanation:`The passage establishes that octopuses can squeeze through tiny gaps and that aquariums must seal every opening—implying that an unsealed gap would be used to escape. Choice B is the only completion consistent with this logic.` },

{ set:'s2', tag:'Inferences',
  passage:`Archaeologists excavating a Bronze Age settlement found cooking hearths inside nearly every dwelling, but only a handful of large communal ovens at the settlement's center, each one blackened from heavy, repeated use and surrounded by broken pottery from many different households' styles.`,
  stem:`Which choice best states what can reasonably be inferred from the passage?`,
  choices:[
    `Most families in the settlement cooked all of their meals exclusively in the communal ovens.`,
    `While households handled everyday cooking themselves, the communal ovens were likely used by multiple families for shared or specialized baking.`,
    `The communal ovens were built after the settlement had already been abandoned by most residents.`,
    `Pottery styles were identical across all households in the settlement.`],
  correct:1,
  explanation:`Individual hearths suggest everyday cooking happened at home, while heavily used communal ovens surrounded by pottery from many households suggest shared, perhaps occasional or specialized, use. Choice B fits both pieces of evidence; the others contradict details in the passage.` },

{ set:'s2', tag:'Inferences',
  passage:`A librarian noticed that requests for large-print books rose sharply every year in October and November, then fell back to typical levels by January, a pattern that did not match seasonal borrowing trends for any other section of the library.`,
  stem:`Which choice most logically completes the text?`,
  choices:[
    `the library likely ordered too many large-print books at the start of each year.`,
    `something specific to those two months, rather than a general seasonal pattern, was probably driving the increase.`,
    `readers of large-print books preferred to borrow fiction rather than nonfiction.`,
    `the library's large-print collection was smaller than its standard-print collection.`],
  correct:1,
  explanation:`Because the spike doesn't match seasonal trends elsewhere in the library, something particular to October–November is implicated, not a general seasonal effect. Choice B is the logical conclusion; the other choices aren't supported by the described pattern.` },

{ set:'s2', tag:'Inferences',

  explanation:`Two independent clauses joined by a coordinating conjunction ("but") require a comma before the conjunction. Choice A correctly punctuates this. B uses the wrong conjunction for a contrast, C incorrectly adds an extra comma after "but," and D creates a run-on sentence by omitting the comma.` },

{ set:'s7', tag:'Boundaries',
  passage:`Marcus spent the summer restoring an old motorcycle _______ a project that taught him more about patience than any of his classes had.`,
  stem:`Which choice completes the text so that it conforms to the conventions of Standard English?`,
  choices:[`,`,`;`,`and`,`,and`],
  correct:0,
  explanation:`"A project that taught him..." is a noun phrase renaming "restoring an old motorcycle," so it should be set off with a comma, not joined as if it were an independent clause. A semicolon (choice B) is incorrect because what follows is not an independent clause.` },

{ set:'s7', tag:'Boundaries',
  passage:`The committee reviewed three finalists for the scholarship _______ each candidate had submitted an essay, two letters of recommendation, and a portfolio of work.`,
  stem:`Which choice completes the text so that it conforms to the conventions of Standard English?`,
  choices:[`, since`,`; since`,`. Since`,`since`],
  correct:0,
  explanation:`"Since each candidate had submitted..." is a dependent clause providing a reason, correctly attached to the independent clause with a comma. A semicolon (B) requires an independent clause on both sides, and a period (C) would create a sentence fragment.` },

{ set:'s7', tag:'Boundaries',
  passage:`Only one instrument survived the shipwreck intact _______ a small brass compass that a diver recovered nearly two centuries later.`,
  stem:`Which choice completes the text so that it conforms to the conventions of Standard English?`,
  choices:[`:`,`,`,`; which was`,`and was`],
  correct:0,
  explanation:`A colon can introduce an explanation or elaboration of what precedes it—here, identifying the one surviving instrument. Choice A is correct; the other options either create a run-on or a grammatically awkward construction.` },

{ set:'s7', tag:'Boundaries',
  passage:`Researchers had expected the glacier to retreat gradually over decades _______ instead, satellite images showed it losing nearly a quarter of its mass within a single year.`,
  stem:`Which choice completes the text so that it conforms to the conventions of Standard English?`,
  choices:[`;`,`,`,`and`,`, and`],
  correct:0,
  explanation:`Both parts of the sentence are independent clauses expressing a contrast, so they can be joined with a semicolon. Choice A is correct; a comma alone (B) would create a comma splice.` },

{ set:'s7', tag:'Boundaries',
  passage:`The novel's ending, _______ many readers found abrupt, was actually planned by the author from the very first draft.`,
  stem:`Which choice completes the text so that it conforms to the conventions of Standard English?`,
  choices:[`which`,`, which,`,`that`,`it`],
  correct:0,
  explanation:`The nonessential clause "which many readers found abrupt" needs to be set off by commas on both sides. Since the sentence already provides a comma after "ending," the clause should begin with "which" (no extra comma before it) and end with a comma before "was." Choice A fits this pattern correctly within the given structure.` },

{ set:'s7', tag:'Boundaries',
  passage:`Few visitors realize that the botanical garden's oldest tree predates the city itself _______ having been planted nearly a century before the first streets were paved.`,
  stem:`Which choice completes the text so that it conforms to the conventions of Standard English?`,
  choices:[`,`,`;`,`.`,`and`],
  correct:0,
  explanation:`"Having been planted nearly a century before..." is a participial phrase modifying the tree, not an independent clause, so it should be attached with a comma. A semicolon or period (B, C) would incorrectly treat it as a complete sentence.` }

// Set 8: Form, Structure & Sense (8)
QUESTIONS.push(
{ set:'s8', tag:'Form / Structure / Sense',
  passage:`The collection of essays, which spans nearly forty years of the author's career, _______ widely regarded as her most personal work.`,
  stem:`Which choice completes the text so that it conforms to the conventions of Standard English?`,
  choices:[`is`,`are`,`were`,`have been`],
  correct:0,
  explanation:`The subject of the sentence is "the collection" (singular), not "essays" or "years," which are objects of prepositional phrases. A singular verb, "is," is required to agree with "the collection."` },

{ set:'s8', tag:'Form / Structure / Sense',
  passage:`By the time the search party reached the summit, the storm _______ for nearly three hours, forcing the climbers to shelter behind a ridge of rock.`,
  stem:`Which choice completes the text so that it conforms to the conventions of Standard English?`,
  choices:[`had been raging`,`rages`,`will rage`,`is raging`],
  correct:0,
  explanation:`The storm's raging began and continued before the search party's arrival, a past action completed relative to another past action—requiring the past perfect progressive, "had been raging."` },

{ set:'s8', tag:'Form / Structure / Sense',
  passage:`Neither the coach nor the players _______ satisfied with the referee's final call.`,
  stem:`Which choice completes the text so that it conforms to the conventions of Standard English?`,
  choices:[`were`,`was`,`is`,`has been`],
  correct:0,
  explanation:`With "neither...nor" constructions, the verb agrees with the noun closest to it—here, "players" (plural)—so the plural verb "were" is correct.` },

{ set:'s8', tag:'Form / Structure / Sense',
  passage:`Walking through the abandoned house at dusk, _______`,
  stem:`Which choice completes the text so that it conforms to the conventions of Standard English?`,
  choices:[

    `it seemed to Priya that every floorboard's creak was far louder than in daylight.`],
  correct:1,
  explanation:`The introductory phrase "Walking through the abandoned house at dusk" must be immediately followed by the person doing the walking. Only choice B places "Priya" right after the modifier. In the other choices, "the creak," "every floorboard," and "it" are left to illogically do the walking.` },

{ set:'s8', tag:'Form / Structure / Sense',
  passage:`Each of the museum's rotating exhibits _______ curated by a different visiting artist, giving the space a constantly changing character.`,
  stem:`Which choice completes the text so that it conforms to the conventions of Standard English?`,
  choices:[`is`,`are`,`were`,`have been`],
  correct:0,
  explanation:`"Each" is singular, regardless of the plural noun ("exhibits") that follows it in the prepositional phrase. The singular verb "is" is required to agree with "each."` },

{ set:'s8', tag:'Form / Structure / Sense',

/* ============ APP LOGIC ============ */
let state = { screen:'home', domain:null, setId:null, mixed:false, qIndex:0, answers:[], order:[] };
let sessionSetsCompleted = 0;
let bestScores = {}; // setId -> best percent (in-memory, resets on reload)

function questionsForSet(setId){ return QUESTIONS.filter(q=>q.set===setId); }
function questionsForDomain(domainId){
  const setIds = SETS.filter(s=>s.domain===domainId).map(s=>s.id);
  return QUESTIONS.filter(q=>setIds.includes(q.set));
}

function goHome(){ state = { screen:'home', domain:null, setId:null, mixed:false, qIndex:0, answers:[], order:[] }; render(); }
function openDomain(domainId){ state.screen='setlist'; state.domain=domainId; render(); }
function startSet(setId){
  const qs = questionsForSet(setId);
  state = { screen:'quiz', domain:state.domain, setId, mixed:false, qIndex:0, answers:new Array(qs.length).fill(null), order:qs.map((_,i)=>i) };
  render();
}
function startMixed(){
  const order = QUESTIONS.map((_,i)=>i);
  for(let i=order.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [order[i],order[j]]=[order[j],order[i]]; }
  state = { screen:'quiz', domain:null, setId:null, mixed:true, qIndex:0, answers:new Array(order.length).fill(null), order };
  render();
}
function currentPool(){ return state.mixed ? QUESTIONS : questionsForSet(state.setId); }

function selectChoice(i){
  const pool = currentPool();
  const q = pool[state.order[state.qIndex]];
  if(state.answers[state.qIndex] !== null) return; // already answered
  state.answers[state.qIndex] = i;
  render();
}
function nextQuestion(){
  const pool = currentPool();
  if(state.qIndex < pool.length-1){ state.qIndex++; render(); }
  else { finishQuiz(); }
}
function finishQuiz(){
  sessionSetsCompleted++;
  const pool = currentPool();
  let correct=0;
  pool.forEach((q,i)=>{ if(state.answers[i]===q.correct) correct++; });
  const pct = Math.round(100*correct/pool.length);
  if(state.setId) bestScores[state.setId] = Math.max(bestScores[state.setId]||0, pct);
  state.screen='results';
  render();
}
function retrySet(){
  if(state.mixed) startMixed(); else startSet(state.setId);
}
function backToSets(){ state.screen='setlist'; render(); }

/* ============ RENDER ============ */
function render(){
  document.getElementById('sessionStats').textContent = `Sets completed this session: ${sessionSetsCompleted}`;
  const app = document.getElementById('app');
  if(state.screen==='home') app.innerHTML = renderHome();
  else if(state.screen==='setlist') app.innerHTML = renderSetList();
  else if(state.screen==='quiz') app.innerHTML = renderQuiz();
  else if(state.screen==='results') app.innerHTML = renderResults();
  window.scrollTo({top:0,behavior:'smooth'});
}

function renderHome(){
  let html = `<div class="section-title">Practice by Category</div>
  <div class="section-sub">Based on the digital SAT Reading &amp; Writing framework — pick a domain to see its practice sets.</div>
  <div class="domain-grid">`;
  DOMAINS.forEach(d=>{
    const qs = questionsForDomain(d.id);
    const setIds = SETS.filter(s=>s.domain===d.id).map(s=>s.id);
    const doneSets = setIds.filter(id=>bestScores[id]!==undefined).length;
    html += `<div class="domain-card" style="--accent:${d.color}" onclick="openDomain('${d.id}')">
      <h3>${d.name}</h3>
      <p>${d.blurb}</p>
      <div class="chip-row">${d.subtopics.map(s=>`<span class="chip">${s}</span>`).join('')}</div>
      <div class="domain-progress"><b>${qs.length}</b> questions &middot; <b>${setIds.length}</b> sets &middot; ${doneSets}/${setIds.length} attempted</div>
    </div>`;
  });
  html += `</div>
  <div class="mixed-cta">
    <div>
      <h3>Full Mixed Practice</h3>
      <p>${QUESTIONS.length} questions, shuffled across all four domains — simulates a real section.</p>
    </div>
    <button class="btn btn-light" onclick="startMixed()">Start Mixed Set →</button>
  </div>`;
  return html;
}

function renderSetList(){
  const d = DOMAINS.find(x=>x.id===state.domain);
  const sets = SETS.filter(s=>s.domain===state.domain);
  let html = `<button class="back-link" onclick="goHome()">← All domains</button>
  <div class="section-title">${d.name}</div>
  <div class="section-sub">${d.blurb}</div>
  <div class="set-list">`;
  sets.forEach(s=>{
    const qs = questionsForSet(s.id);
    const best = bestScores[s.id];
    html += `<div class="set-row">
      <div class="info">
        <h4>${s.title}</h4>
        <p>${s.desc} &middot; ${qs.length} questions</p>
      </div>
      <div class="right">
        <div class="best-score">${best!==undefined ? `<b>${best}%</b>best` : '<b>—</b>not started'}</div>
        <button class="btn btn-primary" onclick="startSet('${s.id}')">${best!==undefined?'Retry':'Start'}</button>
      </div>
    </div>`;
  });
  html += `</div>`;
  return html;
}

function renderPassage(q){
  if(!q.passage) return '';
  if(typeof q.passage === 'string'){
    return `<div class="passage">${q.passage}</div>`;
  }
  return `<div class="passage two-text">
    <div><span class="label">Text 1</span>${q.passage.a}</div>
    <div><span class="label">Text 2</span>${q.passage.b}</div>
  </div>`;
}

function renderQuiz(){
  const pool = currentPool();
  const q = pool[state.order[state.qIndex]];
  const answered = state.answers[state.qIndex];
  const total = pool.length;
  const setTitle = state.mixed ? 'Full Mixed Practice' : SETS.find(s=>s.id===state.setId).title;
  const letters = ['A','B','C','D'];

  let choicesHtml = '';
  q.choices.forEach((c,i)=>{
    let cls = 'choice';
    if(answered!==null){
      cls += ' disabled';
      if(i===q.correct) cls += ' correct';
      else if(i===answered) cls += ' incorrect';
      else cls += ' dim';
    }
    choicesHtml += `<button class="${cls}" onclick="selectChoice(${i})" ${answered!==null?'disabled':''}>
      <span class="letter">${letters[i]}</span><span>${c}</span>
    </button>`;
  });

  let feedback = '';
  if(answered!==null){
    const isGood = answered===q.correct;
    feedback = `<div class="feedback ${isGood?'good':'bad'}">
      <b>${isGood ? 'Correct!' : `Not quite — the correct answer is ${letters[q.correct]}.`}</b>
      ${q.explanation}
    </div>`;
  }

  return `<button class="back-link" onclick="${state.mixed?'goHome()':'backToSets()'}">← ${state.mixed?'Home':'Back to sets'}</button>
  <div class="quiz-header">
    <div class="quiz-title">${setTitle} &middot; Question ${state.qIndex+1} of ${total}</div>
    <div class="quiz-title">${q.tag||''}</div>
  </div>
  <div class="progress-track"><div class="progress-fill" style="width:${100*(state.qIndex)/total}%"></div></div>
  <div class="q-card">
    <span class="q-tag">${q.tag}</span>
    ${renderPassage(q)}
    <div class="stem">${q.stem}</div>
    <div class="choices">${choicesHtml}</div>
    ${feedback}
  </div>
  <div class="quiz-footer">
    <button class="btn btn-primary" onclick="nextQuestion()" ${answered===null?'disabled':''}>${state.qIndex===total-1?'See Results':'Next Question'} →</button>
  </div>`;
}

function renderResults(){
  const pool = currentPool();
  let correct=0;
  pool.forEach((q,i)=>{ if(state.answers[i]===q.correct) correct++; });
  const pct = Math.round(100*correct/pool.length);
  const letters=['A','B','C','D'];
  const label = state.mixed ? 'Full Mixed Practice' : SETS.find(s=>s.id===state.setId).title;

  let review = '';
  pool.forEach((q,i)=>{
    const ans = state.answers[i];
    const good = ans===q.correct;
    review += `<div class="review-item">
      <div class="tag-row"><span class="status-pill ${good?'good':'bad'}">${good?'Correct':'Incorrect'}</span><span class="q-tag" style="margin:0;">${q.tag}</span></div>
      ${renderPassage(q)}
      <div class="stem">${q.stem}</div>
      <div class="review-line">Your answer: <b>${letters[ans]}. ${q.choices[ans]}</b></div>
      ${!good?`<div class="review-line">Correct answer: <b>${letters[q.correct]}. ${q.choices[q.correct]}</b></div>`:''}
      <div class="review-explain">${q.explanation}</div>
    </div>`;
  });

  return `<div class="result-hero">
    <div class="section-sub" style="margin-bottom:0;">${label}</div>
    <div class="score-big">${correct} / ${pool.length}</div>
    <div class="score-sub">${pct}% correct</div>
    <div class="result-actions">
      <button class="btn btn-primary" onclick="retrySet()">Retry This Set</button>
      <button class="btn btn-ghost" onclick="${state.mixed?'goHome()':'backToSets()'}">${state.mixed?'Back to Home':'Back to Sets'}</button>
      <button class="btn btn-ghost" onclick="goHome()">All Domains</button>
    </div>
  </div>
  <div class="section-title" style="font-size:18px;">Review Answers</div>
  <div class="section-sub">Read the explanation for each question, especially the ones you missed.</div>
  ${review}`;
}

render();
</script>
